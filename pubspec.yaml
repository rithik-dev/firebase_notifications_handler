name: firebase_notifications_handler
description: Easy-to-use Firebase notifications handler with built-in local notifications support, allowing your app to display notifications in the foreground without extra setup.
version: 3.0.0
homepage: https://github.com/rithik-dev/firebase_notifications_handler
repository: https://github.com/rithik-dev/firebase_notifications_handler
issue_tracker: https://github.com/rithik-dev/firebase_notifications_handler/issues
documentation: https://github.com/rithik-dev/firebase_notifications_handler/blob/master/README.md

# Kept in pub_screenshots/ rather than .github/ with the README's other images, because screenshots
# have to ship inside the published archive: pub.dev builds the search thumbnail and the package
# page gallery from the file it actually receives, and it excludes hidden directories.
screenshots:
  - description: 'An expanded notification received via FirebaseNotificationsHandler.'
    path: pub_screenshots/notification.webp

topics: 
  - flutter
  - firebase
  - messaging
  - notifications
  - push-notifications

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  path: ^1.9.1
  timezone: ^0.11.1
  path_provider: ^2.1.6
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_lints: ^6.0.0

false_secrets:
  - /example/lib/firebase_options.dart